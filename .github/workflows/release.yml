name: Signed candidate rehearsal or Central release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version already committed in pom.xml (for example 0.1.0)
        required: true
        type: string
      source_commit:
        description: Full immutable 40-character source commit SHA
        required: true
        type: string
      mode:
        description: Rehearsal signs and consumes only; publish is the separate formal release operation
        required: true
        default: rehearsal
        type: choice
        options: [rehearsal, publish]
      recovery_deployment_id:
        description: Optional known Central deployment ID after an ambiguous upload
        required: false
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: magika-central-release
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Validate immutable source input
        env:
          SOURCE_SHA: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - id: pin
        env:
          SOURCE_SHA: ${{ inputs.source_commit }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$SOURCE_SHA"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    uses: ./.github/workflows/verify.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
      version: ${{ inputs.version }}
  sign:
    needs: [source, verify]
    runs-on: ubuntu-24.04
    environment: maven-central
    outputs:
      fingerprint: ${{ steps.sign.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: candidate-java-*
          path: target/matrix
      - name: Require identical distribution bytes from all three verification jobs
        run: node scripts/release/release.mjs select target/matrix target/signed-candidate
      - name: Sign with the configured release key or recover the identical stored candidate
        id: sign
        env:
          GH_TOKEN: ${{ github.token }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_FINGERPRINT: ${{ vars.MAVEN_GPG_FINGERPRINT }}
        run: |
          node scripts/release/release.mjs prepare target/signed-candidate
          node scripts/release/candidate.mjs verify target/signed-candidate | tee target/signature-verification.log
          echo "fingerprint=$MAVEN_GPG_FINGERPRINT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-candidate
          path: target/signed-candidate/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signature-verification
          path: target/signature-verification.log
          if-no-files-found: error
  consume:
    needs: [source, sign]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: ['8', '17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS' # Adoptium SemVer for Temurin 21.0.12.1+1
      - run: echo "BUILD_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.runtime }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-candidate
          path: target/signed-candidate
      - name: Verify and install signed candidate into a fresh Maven repository; consume without network or Python
        env:
          MAVEN_GPG_FINGERPRINT: ${{ needs.sign.outputs.fingerprint }}
        run: |
          runtime_jdk="$JAVA_HOME"
          export JAVA_HOME="$BUILD_JAVA_HOME"
          bash scripts/consume-candidate.sh "$PWD/target/signed-candidate" "$runtime_jdk" "$RUNNER_TEMP/isolated-consumer" 2>&1 | tee "$RUNNER_TEMP/signed-consumer.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-consumer-java-${{ matrix.runtime }}
          path: ${{ runner.temp }}/signed-consumer.log
          if-no-files-found: error
  publish:
    if: inputs.mode == 'publish'
    needs: [source, verify, sign, consume]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: maven-central
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-candidate
          path: target/signed-candidate
      - name: Preserve candidate and deployment identity, reconcile external state, publish and complete GitHub records
        env:
          GH_TOKEN: ${{ github.token }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_FINGERPRINT: ${{ vars.MAVEN_GPG_FINGERPRINT }}
          RECOVERY_DEPLOYMENT_ID: ${{ inputs.recovery_deployment_id }}
        run: node scripts/release/release.mjs publish target/signed-candidate
