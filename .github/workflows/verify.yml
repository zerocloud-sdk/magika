name: Verify offline single-input and batch SDK
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: ['8', '17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Install build JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Save compiler path
        run: echo "BUILD_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Install test JVM
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.runtime }}
      - name: Build with 21; verify and install using selected test JVM
        shell: bash
        run: |
          runtime_jdk="$JAVA_HOME"
          echo "RUNTIME_JDK=$runtime_jdk" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            "$BUILD_JAVA_HOME/bin/java" -version
            "$runtime_jdk/bin/java" -version
            cat /etc/os-release
            uname -m
            node --version
            gpg --version
          } 2>&1 | tee "$RUNNER_TEMP/runtime.log"
          export JAVA_HOME="$BUILD_JAVA_HOME"
          mvn -B -ntp -Dtest.java.home="$runtime_jdk" clean install | tee "$RUNNER_TEMP/maven.log"
          sdk_version=$(node -e 'console.log(require("fs").readFileSync("pom.xml","utf8").match(/<version>([^<]+)<\/version>/)[1])')
          echo "SDK_VERSION=$sdk_version" >> "$GITHUB_ENV"
          mvn -B -ntp -f examples/offline/pom.xml "-Dmagika.version=$sdk_version" clean package | tee "$RUNNER_TEMP/consumer-build.log"
      - name: Verify supported vocabulary, cryptographic checks and release recovery scenarios
        if: matrix.runtime == '21'
        run: |
          node scripts/release/supported-types.mjs --check
          node --test scripts/release/*.test.mjs | tee "$RUNNER_TEMP/release-tests.log"
      - name: Inspect complete unsigned distribution from this exact source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$RELEASE_VERSION" ]]; then
            RELEASE_VERSION="$SDK_VERSION"
          fi
          node scripts/release/candidate.mjs stage "$RELEASE_VERSION" "$(git rev-parse HEAD)" "$PWD/target/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-java-${{ matrix.runtime }}
          path: target/candidate/
          if-no-files-found: error
      - name: Consume packaged SDK with no network or Python
        run: bash scripts/verify-offline.sh "$RUNTIME_JDK" "$PWD/examples/offline/target" "$SDK_VERSION" | tee "$RUNNER_TEMP/offline.log"
      - name: Preserve actual JVM and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-java-${{ matrix.runtime }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            ${{ runner.temp }}/runtime.log
            ${{ runner.temp }}/maven.log
            ${{ runner.temp }}/consumer-build.log
            ${{ runner.temp }}/offline.log
            ${{ runner.temp }}/release-tests.log
